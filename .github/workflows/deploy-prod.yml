name: Deploy Vue to S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets with long cache
        run: |
          aws s3 sync dist/assets s3://${{ vars.S3_BUCKET }}/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload root files with no-cache
        run: |
          aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront through Lambda
        run: |
          payload=$(jq -nc \
            --arg did "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            '{distributionId:$did,paths:["/","/index.html"]}')

          aws lambda invoke \
            --function-name "${{ vars.CF_INVALIDATOR_LAMBDA }}" \
            --payload "$payload" \
            --cli-binary-format raw-in-base64-out \
            response.json

          cat response.json
