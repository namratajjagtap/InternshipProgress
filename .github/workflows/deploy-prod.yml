name: Deploy Vue to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Debug OIDC token claims (temporary)
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"

          TOKEN_RESPONSE=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          ID_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
          export ID_TOKEN

          python -c "import base64,json,os; token=os.environ.get('ID_TOKEN',''); payload_b64=token.split('.')[1]; payload_b64 += '=' * (-len(payload_b64) % 4); payload=json.loads(base64.urlsafe_b64decode(payload_b64).decode()); print(f\"oidc.sub={payload.get('sub')}\"); print(f\"oidc.aud={payload.get('aud')}\"); print(f\"oidc.iss={payload.get('iss')}\")"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets with long cache
        run: |
          aws s3 sync dist/assets s3://${{ vars.S3_BUCKET }}/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload root files with no-cache
        run: |
          aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

